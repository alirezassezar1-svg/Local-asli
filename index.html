<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<meta name="description" content="NONONICK DIGITAL OS — Local-First Digital Engineering Workspace">
<title>NONONICK DIGITAL OS</title>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a25;
  --border: #2a2a3a;
  --text: #e8e8f0;
  --text-dim: #9898a8;
  --accent: #00d4ff;
  --accent2: #7b61ff;
  --success: #00e676;
  --warning: #ffab00;
  --danger: #ff5252;
  --glass: rgba(18,18,26,0.85);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro", "Segoe UI", system-ui, sans-serif;
}
[data-theme="light"] {
  --bg: #f4f4f8;
  --surface: #ffffff;
  --surface2: #f0f0f5;
  --border: #d0d0dc;
  --text: #1a1a22;
  --text-dim: #666680;
  --glass: rgba(255,255,255,0.9);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: var(--font); background: var(--bg); color: var(--text); }
body { padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
#app { display: flex; flex-direction: column; height: 100%; }
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: var(--glass); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px); z-index: 100;
}
.logo { font-weight: 700; font-size: 15px; letter-spacing: 0.5px; color: var(--accent); }
.logo span { color: var(--text-dim); font-weight: 400; }
.header-actions { display: flex; gap: 8px; }
.btn {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text);
  padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: 0.15s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 5px 9px; font-size: 12px; }
main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
#nav {
  display: flex; overflow-x: auto; gap: 4px; padding: 8px 10px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
#nav::-webkit-scrollbar { display: none; }
.nav-item {
  flex-shrink: 0; padding: 8px 12px; border-radius: 8px; font-size: 12px;
  background: transparent; border: 1px solid transparent; color: var(--text-dim);
  cursor: pointer; white-space: nowrap;
}
.nav-item.active { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
#content { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; margin-bottom: 10px;
}
.card-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.stat { text-align: center; padding: 12px; background: var(--surface2); border-radius: 10px; }
.stat-val { font-size: 22px; font-weight: 700; color: var(--accent); }
.stat-lbl { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
input, textarea, select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px;
  font-family: inherit; outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { min-height: 90px; resize: vertical; }
label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; margin-top: 10px; }
.form-row { display: flex; gap: 8px; }
.form-row > * { flex: 1; }
.list-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px; background: var(--surface2); border-radius: 8px; margin-bottom: 6px;
  cursor: pointer; border: 1px solid transparent;
}
.list-item:active { border-color: var(--accent); }
.list-item .meta { font-size: 11px; color: var(--text-dim); }
.empty { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 14px; }
.badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; background: var(--surface2); color: var(--accent); }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
}
.modal {
  background: var(--surface); border-radius: 16px 16px 0 0; width: 100%; max-width: 500px;
  max-height: 85vh; overflow-y: auto; padding: 16px; padding-bottom: calc(16px + var(--safe-bottom));
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.modal-title { font-weight: 600; font-size: 16px; }
.close-btn { background: none; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer; }
.toast {
  position: fixed; bottom: calc(20px + var(--safe-bottom)); left: 50%; transform: translateX(-50%);
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 300;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 90%;
}
.cmd-palette {
  position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
  width: 92%; max-width: 420px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; z-index: 250; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.cmd-palette input { border: none; border-bottom: 1px solid var(--border); border-radius: 14px 14px 0 0; }
.cmd-results { max-height: 280px; overflow-y: auto; }
.cmd-item { padding: 12px 14px; cursor: pointer; font-size: 14px; border-bottom: 1px solid var(--border); }
.cmd-item:active, .cmd-item.sel { background: var(--surface2); color: var(--accent); }
pre, code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
pre { background: var(--bg); padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; }
.tab { padding: 7px 12px; border-radius: 6px; font-size: 12px; background: var(--surface2); cursor: pointer; white-space: nowrap; }
.tab.active { background: var(--accent); color: #000; }
.preview-frame { width: 100%; height: 200px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
.hidden { display: none !important; }
.loading { text-align: center; padding: 30px; color: var(--text-dim); }
.warn { color: var(--warning); font-size: 12px; margin-top: 6px; }
.success { color: var(--success); }
.error { color: var(--danger); }
.flex { display: flex; gap: 8px; align-items: center; }
.flex-1 { flex: 1; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mb-8 { margin-bottom: 8px; }
[dir="ltr"] { direction: ltr; text-align: left; }
.node-box {
  position: absolute; min-width: 100px; padding: 8px 12px; background: var(--surface2);
  border: 1px solid var(--accent); border-radius: 8px; font-size: 12px; cursor: move;
  user-select: none; text-align: center;
}
#diagram-canvas { position: relative; width: 100%; height: 320px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">NONONICK <span>DIGITAL OS</span></div>
    <div class="header-actions">
      <button class="btn btn-sm btn-ghost" id="btn-cmd" title="Command">⌘</button>
      <button class="btn btn-sm btn-ghost" id="btn-theme">◐</button>
      <button class="btn btn-sm btn-ghost" id="btn-lang">EN</button>
      <button class="btn btn-sm" id="btn-menu">☰</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <main>
    <div id="content"></div>
  </main>
</div>

<script>
/* ============================================================
   NONONICK DIGITAL OS v1.0.0
   Local-First Digital Engineering Workspace
   Single-file vanilla HTML/CSS/JS — IndexedDB primary store
   ============================================================ */

const APP_VERSION = '1.0.0';
const DB_NAME = 'NononickDigitalOS';
const DB_VERSION = 1;

const MODULES = [
  { id: 'dashboard', name: { fa: 'مرکز فرمان', en: 'Command Center' }, icon: '◈' },
  { id: 'product', name: { fa: 'مهندسی محصول', en: 'Product Studio' }, icon: '◆' },
  { id: 'xray', name: { fa: 'ایکس‌ری وب', en: 'Website X-Ray' }, icon: '◎' },
  { id: 'api', name: { fa: 'آزمایشگاه API', en: 'API Lab' }, icon: '⚡' },
  { id: 'diagram', name: { fa: 'نقشه‌بردار جریان', en: 'Data Flow' }, icon: '⬡' },
  { id: 'auto', name: { fa: 'سازنده اتوماسیون', en: 'Automation' }, icon: '⟳' },
  { id: 'perf', name: { fa: 'رصد عملکرد', en: 'Performance' }, icon: '▣' },
  { id: 'asset', name: { fa: 'هوش دارایی', en: 'Assets' }, icon: '▤' },
  { id: 'component', name: { fa: 'آزمایشگاه کامپوننت', en: 'Components' }, icon: '▣' },
  { id: 'research', name: { fa: 'موتور پژوهش', en: 'Research' }, icon: '◉' },
  { id: 'backup', name: { fa: 'پشتیبان و حریم', en: 'Backup & Privacy' }, icon: '▣' }
];

let db = null;
let state = {
  lang: localStorage.getItem('nn_lang') || 'fa',
  theme: localStorage.getItem('nn_theme') || 'dark',
  currentModule: 'dashboard',
  editingId: null
};

// -------------------- Utilities --------------------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = () => new Date().toISOString();
const t = (fa, en) => state.lang === 'fa' ? fa : en;
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const toast = (msg, ms = 2800) => {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
};
const sanitize = (str) => {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
};
const escapeHtml = (s) => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// -------------------- IndexedDB --------------------
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      const stores = [
        'projects', 'specs', 'api_requests', 'api_history',
        'diagrams', 'workflows', 'workflow_logs',
        'xray_reports', 'assets', 'components', 'component_versions',
        'research', 'tasks', 'activity', 'settings'
      ];
      stores.forEach(name => {
        if (!d.objectStoreNames.contains(name)) {
          const store = d.createObjectStore(name, { keyPath: 'id' });
          if (name === 'activity') store.createIndex('ts', 'ts');
          if (name === 'assets') store.createIndex('name', 'name');
          if (name === 'research') store.createIndex('tags', 'tags', { multiEntry: true });
        }
      });
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

function tx(storeName, mode = 'readonly') {
  return db.transaction(storeName, mode).objectStore(storeName);
}

function getAll(store) {
  return new Promise((res, rej) => {
    const r = tx(store).getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
}

function getById(store, id) {
  return new Promise((res, rej) => {
    const r = tx(store).get(id);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

function put(store, data) {
  return new Promise((res, rej) => {
    const r = tx(store, 'readwrite').put(data);
    r.onsuccess = () => res(data);
    r.onerror = () => rej(r.error);
  });
}

function del(store, id) {
  return new Promise((res, rej) => {
    const r = tx(store, 'readwrite').delete(id);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}

function logActivity(action, detail) {
  put('activity', { id: uid(), action, detail, ts: now() }).catch(() => {});
}

async function getCounts() {
  const stores = ['projects','specs','api_requests','diagrams','workflows','assets','components','research','tasks'];
  const counts = {};
  for (const s of stores) {
    try { counts[s] = (await getAll(s)).length; } catch { counts[s] = 0; }
  }
  return counts;
}

// -------------------- Navigation & UI --------------------
function renderNav() {
  const nav = $('#nav');
  nav.innerHTML = MODULES.map(m =>
    `<button class="nav-item ${state.currentModule === m.id ? 'active' : ''}" data-mod="${m.id}">${m.icon} ${m.name[state.lang]}</button>`
  ).join('');
  $$('.nav-item').forEach(b => b.onclick = () => openModule(b.dataset.mod));
}

function openModule(id) {
  state.currentModule = id;
  state.editingId = null;
  renderNav();
  const fn = moduleRenderers[id];
  if (fn) fn();
  else $('#content').innerHTML = `<div class="empty">${t('ماژول در دسترس نیست','Module unavailable')}</div>`;
}

function showModal(title, bodyHtml, footerHtml = '') {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">${title}</div>
        <button class="close-btn">×</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      ${footerHtml ? `<div class="mt-12">${footerHtml}</div>` : ''}
    </div>`;
  document.body.appendChild(overlay);
  $('.close-btn', overlay).onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  return overlay;
}

// -------------------- Modules --------------------
const moduleRenderers = {};

// 10 — Digital Command Center
moduleRenderers.dashboard = async () => {
  const c = $('#content');
  c.innerHTML = `<div class="loading">${t('در حال بارگذاری...','Loading...')}</div>`;
  const counts = await getCounts();
  const recent = (await getAll('activity')).sort((a,b) => b.ts.localeCompare(a.ts)).slice(0, 8);
  c.innerHTML = `
    <div class="card">
      <div class="card-title">${t('مرکز فرمان دیجیتال','Digital Command Center')}</div>
      <div class="grid">
        <div class="stat"><div class="stat-val">${counts.projects}</div><div class="stat-lbl">${t('پروژه','Projects')}</div></div>
        <div class="stat"><div class="stat-val">${counts.specs}</div><div class="stat-lbl">${t('مشخصات','Specs')}</div></div>
        <div class="stat"><div class="stat-val">${counts.api_requests}</div><div class="stat-lbl">${t('درخواست API','API Reqs')}</div></div>
        <div class="stat"><div class="stat-val">${counts.diagrams}</div><div class="stat-lbl">${t('نمودار','Diagrams')}</div></div>
        <div class="stat"><div class="stat-val">${counts.workflows}</div><div class="stat-lbl">${t('گردش‌کار','Workflows')}</div></div>
        <div class="stat"><div class="stat-val">${counts.assets}</div><div class="stat-lbl">${t('دارایی','Assets')}</div></div>
        <div class="stat"><div class="stat-val">${counts.components}</div><div class="stat-lbl">${t('کامپوننت','Components')}</div></div>
        <div class="stat"><div class="stat-val">${counts.research}</div><div class="stat-lbl">${t('پژوهش','Research')}</div></div>
        <div class="stat"><div class="stat-val">${counts.tasks}</div><div class="stat-lbl">${t('وظیفه','Tasks')}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">${t('فعالیت اخیر','Recent Activity')}</div>
      ${recent.length ? recent.map(a => `
        <div class="list-item">
          <div><div>${escapeHtml(a.action)}</div><div class="meta">${new Date(a.ts).toLocaleString(state.lang==='fa'?'fa-IR':'en')}</div></div>
        </div>`).join('') : `<div class="empty">${t('هنوز فعالیتی ثبت نشده','No activity yet')}</div>`}
    </div>
    <div class="card">
      <div class="card-title">${t('دسترسی سریع','Quick Actions')}</div>
      <div class="flex" style="flex-wrap:wrap">
        <button class="btn btn-sm" onclick="openModule('product')">${t('پروژه جدید','New Project')}</button>
        <button class="btn btn-sm" onclick="openModule('api')">${t('تست API','API Test')}</button>
        <button class="btn btn-sm" onclick="openModule('backup')">${t('پشتیبان','Backup')}</button>
        <button class="btn btn-sm" onclick="openModule('research')">${t('یادداشت پژوهش','Research Note')}</button>
      </div>
    </div>`;
};

// 01 — Product Engineering Studio
moduleRenderers.product = async () => {
  const c = $('#content');
  const projects = await getAll('projects');
  const specs = await getAll('specs');
  c.innerHTML = `
    <div class="card">
      <div class="card-title">
        ${t('استودیو مهندسی محصول','Product Engineering Studio')}
        <button class="btn btn-sm btn-primary" id="btn-new-proj">+</button>
      </div>
      <div class="tabs">
        <div class="tab active" data-tab="proj">${t('پروژه‌ها','Projects')}</div>
        <div class="tab" data-tab="spec">${t('مشخصات','Specs')}</div>
        <div class="tab" data-tab="task">${t('وظایف','Tasks')}</div>
      </div>
      <div id="prod-list"></div>
    </div>`;
  const list = $('#prod-list');
  const renderList = async (tab) => {
    $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    if (tab === 'proj') {
      list.innerHTML = projects.length ? projects.map(p => `
        <div class="list-item" data-id="${p.id}">
          <div><div>${escapeHtml(p.title)}</div><div class="meta">${escapeHtml(p.status||'')} · ${new Date(p.updated||p.created).toLocaleDateString()}</div></div>
          <button class="btn btn-sm btn-danger del-btn" data-id="${p.id}">×</button>
        </div>`).join('') : `<div class="empty">${t('پروژه‌ای نیست','No projects')}</div>`;
      $$('.list-item', list).forEach(el => el.onclick = (e) => {
        if (e.target.classList.contains('del-btn')) return;
        editProject(el.dataset.id);
      });
      $$('.del-btn', list).forEach(b => b.onclick = async (e) => {
        e.stopPropagation();
        if (confirm(t('حذف پروژه؟','Delete project?'))) { await del('projects', b.dataset.id); logActivity('Delete Project', b.dataset.id); openModule('product'); }
      });
    } else if (tab === 'spec') {
      list.innerHTML = specs.length ? specs.map(s => `
        <div class="list-item" data-id="${s.id}">
          <div><div>${escapeHtml(s.title)}</div><div class="meta">${escapeHtml(s.type||'')}</div></div>
        </div>`).join('') : `<div class="empty">${t('مشخصاتی نیست','No specs')}</div>`;
      $$('.list-item', list).forEach(el => el.onclick = () => editSpec(el.dataset.id));
    } else {
      const tasks = await getAll('tasks');
      list.innerHTML = tasks.length ? tasks.map(t => `
        <div class="list-item">
          <div><div>${escapeHtml(t.title)}</div><div class="meta">${t.done ? '✓' : '○'} ${escapeHtml(t.project||'')}</div></div>
          <button class="btn btn-sm toggle-task" data-id="${t.id}">${t.done?'↩':'✓'}</button>
        </div>`).join('') : `<div class="empty">${t('وظیفه‌ای نیست','No tasks')}</div>`;
      $$('.toggle-task', list).forEach(b => b.onclick = async () => {
        const task = await getById('tasks', b.dataset.id);
        task.done = !task.done; task.updated = now();
        await put('tasks', task); openModule('product');
      });
    }
  };
  $$('.tab').forEach(t => t.onclick = () => renderList(t.dataset.tab));
  renderList('proj');
  $('#btn-new-proj').onclick = () => editProject(null);
};

async function editProject(id) {
  let p = id ? await getById('projects', id) : { id: uid(), title: '', status: 'idea', description: '', milestones: '', checklist: '', created: now(), updated: now() };
  const modal = showModal(id ? t('ویرایش پروژه','Edit Project') : t('پروژه جدید','New Project'), `
    <label>${t('عنوان','Title')}</label><input id="p-title" value="${escapeHtml(p.title)}">
    <label>${t('وضعیت','Status')}</label>
    <select id="p-status">
      <option value="idea" ${p.status==='idea'?'selected':''}>Idea</option>
      <option value="spec" ${p.status==='spec'?'selected':''}>Spec</option>
      <option value="dev" ${p.status==='dev'?'selected':''}>Development</option>
      <option value="release" ${p.status==='release'?'selected':''}>Release</option>
    </select>
    <label>${t('توضیحات / نیازمندی‌ها','Description / Requirements')}</label>
    <textarea id="p-desc">${escapeHtml(p.description)}</textarea>
    <label>${t('معماری / یادداشت','Architecture Notes')}</label>
    <textarea id="p-arch">${escapeHtml(p.architecture||'')}</textarea>
    <label>${t('مایل‌استون‌ها','Milestones')}</label>
    <textarea id="p-mile">${escapeHtml(p.milestones)}</textarea>
    <label>${t('چک‌لیست انتشار','Release Checklist')}</label>
    <textarea id="p-check">${escapeHtml(p.checklist)}</textarea>

    openModule('api');
  };

function collectApiForm(id) {
  return {
    id: id || uid(),
    name: $('#api-name').value.trim(),
    method: $('#api-method').value,
    url: $('#api-url').value.trim(),
    headers: $('#api-headers').value,
    body: $('#api-body').value,
    authType: $('#api-auth').value,
    authValue: $('#api-authval').value,
    updated: now()
  };
}

async function executeApi(existingId) {
  const data = collectApiForm(existingId);
  if (!data.url) return toast(t('URL لازم است','URL required'));
  const respEl = $('#api-resp');
  respEl.innerHTML = `<div class="loading">${t('در حال ارسال...','Sending...')}</div>`;
  const start = performance.now();
  try {
    let headers = {};
    try { headers = JSON.parse(data.headers || '{}'); } catch { headers = {}; }
    if (data.authType === 'bearer' && data.authValue) headers['Authorization'] = 'Bearer ' + data.authValue;
    if (data.authType === 'basic' && data.authValue) headers['Authorization'] = 'Basic ' + btoa(data.authValue);
    const opts = { method: data.method, headers, mode: 'cors' };
    if (['POST','PUT','PATCH'].includes(data.method) && data.body) opts.body = data.body;
    const resp = await fetch(data.url, opts);
    const elapsed = Math.round(performance.now() - start);
    const respHeaders = {};
    resp.headers.forEach((v,k) => respHeaders[k] = v);
    let bodyText = await resp.text();
    if (bodyText.length > 100000) bodyText = bodyText.slice(0, 100000) + '\n…[truncated]';
    const hist = {
      id: uid(), requestId: data.id, url: data.url, method: data.method,
      status: resp.status, elapsed, bodyPreview: bodyText.slice(0, 5000),
      headers: respHeaders, created: now()
    };
    await put('api_history', hist);
    logActivity('API Execute', data.method + ' ' + data.url);
    respEl.innerHTML = `
      <div class="badge">${resp.status} ${resp.statusText}</div>
      <span class="meta"> ${elapsed} ms</span>
      <label>Response Headers</label><pre>${escapeHtml(JSON.stringify(respHeaders, null, 2))}</pre>
      <label>Body</label><pre>${escapeHtml(bodyText)}</pre>`;
    loadApiHistory();
  } catch (err) {
    respEl.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>
      <p class="warn">${t('ممکن است به دلیل CORS یا شبکه مسدود شده باشد.','May be blocked by CORS or network.')}</p>`;
  }
}

window.editDiagram = async (id) => {
  currentDiagram = id ? await getById('diagrams', id) : { id: uid(), name: t('نمودار جدید','New Diagram'), nodes: [], edges: [], created: now() };
  $('#diag-editor').classList.remove('hidden');

    currentDiagram.nodes = currentDiagram.nodes || [];
    currentDiagram.nodes.push(n);
    createNodeEl(n, canvas);
  };
  $('#diag-save').onclick = async () => {
    const name = prompt(t('نام نمودار','Diagram name'), currentDiagram.name);
    if (name) currentDiagram.name = name;
    currentDiagram.updated = now();
    // update positions from DOM
    $$('.node-box', canvas).forEach(el => {
      const n = currentDiagram.nodes.find(x => x.id === el.dataset.id);
      if (n) { n.x = parseInt(el.style.left)||0; n.y = parseInt(el.style.top)||0; n.label = el.textContent; }
    });
    await put('diagrams', currentDiagram);
    logActivity('Save Diagram', currentDiagram.name);
    toast(t('ذخیره شد','Saved'));
    openModule('diagram');
  };

function createNodeEl(n, canvas) {
  const el = document.createElement('div');
  el.className = 'node-box';
  el.dataset.id = n.id;
  el.textContent = n.label;
  el.style.left = (n.x||20) + 'px';
  el.style.top = (n.y||20) + 'px';
  el.contentEditable = true;
  let ox, oy;
  el.onpointerdown = (e) => {
    if (e.target !== el) return;
    ox = e.clientX - el.offsetLeft; oy = e.clientY - el.offsetTop;
    el.setPointerCapture(e.pointerId);
  };
  el.onpointermove = (e) => {
    if (!el.hasPointerCapture(e.pointerId)) return;
    el.style.left = Math.max(0, e.clientX - ox) + 'px';
    el.style.top = Math.max(0, e.clientY - oy) + 'px';
  };
  canvas.appendChild(el);
}

window.runWorkflow = async (id) => {
  const w = await getById('workflows', id);
  if (!w) return;
  const logs = [];
  const start = now();
  try {
    for (const step of (w.steps || [])) {
      if (step.type === 'log') {
        logs.push({ step: 'log', msg: step.value || '', ts: now() });
      } else if (step.type === 'create_task') {
        const task = { id: uid(), title: step.value || 'Auto task', done: false, project: w.name, created: now() };
        await put('tasks', task);
        logs.push({ step: 'create_task', msg: task.title, ts: now() });
      } else if (step.type === 'count_store') {
        const cnt = (await getAll(step.value || 'projects')).length;
        logs.push({ step: 'count_store', msg: `${step.value}: ${cnt}`, ts: now() });
      } else {
        logs.push({ step: step.type, msg: t('نوع پشتیبانی‌نشده — رد شد','Unsupported type — skipped'), ts: now() });
      }
    }
    await put('workflow_logs', { id: uid(), workflowId: id, name: w.name, logs, success: true, started: start, finished: now() });
    logActivity('Run Workflow', w.name);
    toast(t('اجرا شد','Executed') + ' — ' + logs.length + ' steps');
  } catch (err) {
    await put('workflow_logs', { id: uid(), workflowId: id, name: w.name, logs, success: false, error: err.message, started: start, finished: now() });
    toast(t('خطا در اجرا','Execution failed'));
  }
};

moduleRenderers.asset = async () => {
  const c = $('#content');
  const assets = await getAll('assets');
  c.innerHTML = `
    <div class="card">
      <div class="card-title">${t('هوش دارایی','Asset Intelligence')}
        <label class="btn btn-sm btn-primary" style="cursor:pointer">${t('وارد کردن','Import')}<input type="file" id="asset-in" multiple hidden></label>
      </div>
      <input id="asset-search" placeholder="${t('جستجو...','Search...')}" class="mb-8">
      <div id="asset-list"></div>
    </div>`;
  const renderAssets = (filter = '') => {
    const filtered = assets.filter(a => !filter || a.name.toLowerCase().includes(filter.toLowerCase()) || (a.category||'').includes(filter));
    $('#asset-list').innerHTML = filtered.length ? filtered.map(a => `
      <div class="list-item">
        <div>
          <div>${escapeHtml(a.name)}</div>
          <div class="meta">${a.type} · ${(a.size/1024).toFixed(1)} KB · ${a.category||''}</div>
        </div>
        <div class="flex">
          ${a.preview ? `<button class="btn btn-sm" onclick="previewAsset('${a.id}')">${t('پیش‌نمایش','Preview')}</button>` : ''}
          <button class="btn btn-sm btn-danger" onclick="delAsset('${a.id}')">×</button>
        </div>
      </div>`).join('') : `<div class="empty">${t('دارایی‌ای نیست','No assets')}</div>`;
  };
  renderAssets();
  $('#asset-search').oninput = (e) => renderAssets(e.target.value);
  $('#asset-in').onchange = async (e) => {
    for (const file of e.target.files) {
      const data = await readFileAsDataURL(file);
      const asset = {
        id: uid(), name: file.name, type: file.type || 'unknown', size: file.size,
        category: file.type.startsWith('image/') ? 'image' : file.type.startsWith('text/') ? 'text' : 'other',
        data, created: now()
      };
      if (file.type.startsWith('image/') && file.size < 2e6) asset.preview = data;
      // simple duplicate check
      const existing = assets.find(a => a.name === file.name && a.size === file.size);
      if (existing) asset.note = 'Possible duplicate of ' + existing.id;
      await put('assets', asset);
      assets.push(asset);
      logActivity('Import Asset', file.name);
    }
    renderAssets();
    toast(t('وارد شد','Imported'));
  };
};
function readFileAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
window.previewAsset = async (id) => {
  const a = await getById('assets', id);
  if (!a || !a.preview) return;
  showModal(a.name, `<img src="${a.preview}" style="max-width:100%;border-radius:8px">`);
};
window.delAsset = async (id) => { await del('assets', id); openModule('asset'); };

window.editComp = async (id) => {

  const modal = showModal(t('کامپوننت','Component'), `
    <label>${t('نام','Name')}</label><input id="c-name" value="${escapeHtml(c.name)}">
    <label>${t('توضیح','Description')}</label><input id="c-desc" value="${escapeHtml(c.description||'')}">
    <label>Tags (comma)</label><input id="c-tags" value="${escapeHtml((c.tags||[]).join(', '))}">
    <label>HTML</label><textarea id="c-html" rows="4">${escapeHtml(c.html)}</textarea>
    <label>CSS</label><textarea id="c-css" rows="3">${escapeHtml(c.css)}</textarea>
    <label>JS</label><textarea id="c-js" rows="3">${escapeHtml(c.js)}</textarea>
    <div class="mt-8">
      <button class="btn btn-sm" id="c-preview">${t('پیش‌نمایش ایمن','Safe Preview')}</button>
      <button class="btn btn-primary" id="c-save">${t('ذخیره','Save')}</button>
    </div>
    <div id="c-prev" class="mt-8"></div>
  `);
  $('#c-preview', modal).onclick = () => {
    const html = $('#c-html', modal).value;
    const css = $('#c-css', modal).value;
    const js = $('#c-js', modal).value;
    const src = `<!DOCTYPE html><html><head><style>${css.replace(/<\/style>/gi,'')}</style></head><body>${html}<script>${js.replace(/<\/script>/gi,'')}<\\/script></body></html>`;
    $('#c-prev', modal).innerHTML = `<iframe class="preview-frame" sandbox="allow-scripts" srcdoc="${escapeHtml(src)}"></iframe>`;
  };
  $('#c-save', modal).onclick = async () => {
    c.name = $('#c-name', modal).value.trim() || 'Component';
    c.description = $('#c-desc', modal).value;
    c.tags = $('#c-tags', modal).value.split(',').map(s => s.trim()).filter(Boolean);
    c.html = $('#c-html', modal).value;
    c.css = $('#c-css', modal).value;
    c.js = $('#c-js', modal).value;
    c.updated = now();
    // version history
    const ver = { id: uid(), componentId: c.id, html: c.html, css: c.css, js: c.js, ts: now() };
    await put('component_versions', ver);
    await put('components', c);
    logActivity('Save Component', c.name);
    modal.remove();
    openModule('component');
  };
};
window.delComp = async (id) => { await del('components', id); openModule('component'); };

window.editRes = async (id) => {
  let r = id ? await getById('research', id) : { id: uid(), title: '', url: '', notes: '', tags: [], extracted: '', created: now() };
  const modal = showModal(t('پژوهش','Research'), `
    <label>${t('عنوان','Title')}</label><input id="r-title" value="${escapeHtml(r.title)}">
    <label>URL</label><input id="r-url" value="${escapeHtml(r.url||'')}" type="url">
    <label>${t('برچسب‌ها','Tags')} (comma)</label><input id="r-tags" value="${escapeHtml((r.tags||[]).join(', '))}">
    <label>${t('یادداشت','Notes')}</label><textarea id="r-notes">${escapeHtml(r.notes)}</textarea>
    <label>${t('متن استخراج‌شده / HTML واردشده','Extracted text / pasted HTML')}</label>
    <textarea id="r-ext">${escapeHtml(r.extracted||'')}</textarea>
    <p class="warn">${t('اگر URL به‌خاطر CORS قابل دریافت نباشد، متن را دستی جای‌گذاری کنید.','If URL is blocked by CORS, paste text manually.')}</p>
  `, `<button class="btn btn-primary" id="r-save">${t('ذخیره','Save')}</button>
      <button class="btn" id="r-fetch">${t('تلاش دریافت','Try Fetch')}</button>`);
  $('#r-fetch', modal).onclick = async () => {
    const url = $('#r-url', modal).value.trim();
    if (!url) return;
    try {
      const resp = await fetch(url, { mode: 'cors' });
      const text = await resp.text();
      $('#r-ext', modal).value = text.slice(0, 30000);
      toast(t('دریافت شد','Fetched'));
    } catch (e) {
      toast(t('مسدود — متن را دستی وارد کنید','Blocked — paste manually'));
    }
  };
  $('#r-save', modal).onclick = async () => {
    r.title = $('#r-title', modal).value.trim() || 'Note';
    r.url = $('#r-url', modal).value.trim();
    r.tags = $('#r-tags', modal).value.split(',').map(s => s.trim()).filter(Boolean);
    r.notes = $('#r-notes', modal).value;
    r.extracted = $('#r-ext', modal).value;
    r.updated = now();
    await put('research', r);
    logActivity('Save Research', r.title);
    modal.remove();
    openModule('research');
  };
};

    for (const s of stores) {
      const all = await getAll(s);
      for (const item of all) await del(s, item.id);

    logActivity('Clear All Data', '');

};

async function exportAll() {
  const stores = ['projects','specs','api_requests','api_history','diagrams','workflows','workflow_logs','xray_reports','assets','components','component_versions','research','tasks','activity','settings'];
  const data = {};
  const counts = {};
  for (const s of stores) {
    data[s] = await getAll(s);
    counts[s] = data[s].length;
  }
  const manifest = {
    app: 'NONONICK DIGITAL OS',
    version: APP_VERSION,
    formatVersion: 1,
    created: now(),
    modules: stores,
    recordCounts: counts,
    note: 'Portable JSON backup. Import via the Backup module.'
  };
  // simple integrity: length checksum
  const payload = JSON.stringify({ manifest, database: data });
  const checksum = await simpleHash(payload);
  const full = { manifest: { ...manifest, checksum }, database: data };
  const blob = new Blob([JSON.stringify(full, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `NONONICK-BACKUP-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  logActivity('Export All', 'Backup created');
  toast(t('خروجی آماده شد','Export ready'));
}

async function simpleHash(str) {
  if (!crypto.subtle) return 'no-subtle';
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 16);
}

async function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const full = JSON.parse(text);
    if (!full.manifest || !full.database) throw new Error('Invalid backup structure');
    const counts = full.manifest.recordCounts || {};
    const preview = Object.entries(counts).map(([k,v]) => `${k}: ${v}`).join('\n');
    if (!confirm(t('پیش‌نمایش وارد کردن:\n','Import preview:\n') + preview + '\n\n' + t('ادامه؟ داده‌های هم‌نام ممکن است جایگزین شوند.','Continue? Same-ID records may be overwritten.'))) return;
    for (const [store, records] of Object.entries(full.database)) {
      if (!Array.isArray(records)) continue;
      for (const rec of records) {
        if (rec && rec.id) await put(store, rec);
      }
    }
    logActivity('Import Backup', full.manifest.created || '');
    toast(t('وارد شد','Imported'));
    openModule('dashboard');
  } catch (err) {
    toast(t('خطا در وارد کردن: ','Import error: ') + err.message);
  }
  e.target.value = '';
}

// -------------------- Command Palette --------------------
function openCommandPalette() {
  const existing = $('.cmd-palette');
  if (existing) { existing.remove(); return; }
  const el = document.createElement('div');
  el.className = 'cmd-palette';
  el.innerHTML = `<input id="cmd-input" placeholder="${t('دستور یا جستجو...','Command or search...')}" autofocus>
    <div class="cmd-results" id="cmd-results"></div>`;
  document.body.appendChild(el);
  const input = $('#cmd-input', el);
  const results = $('#cmd-results', el);
  const commands = [
    { q: ['dashboard','مرکز','command'], action: () => openModule('dashboard'), label: t('مرکز فرمان','Command Center') },
    { q: ['product','پروژه','project'], action: () => openModule('product'), label: t('مهندسی محصول','Product Studio') },
    { q: ['api','آزمایش'], action: () => openModule('api'), label: t('آزمایشگاه API','API Lab') },
    { q: ['xray','وب','website'], action: () => openModule('xray'), label: t('ایکس‌ری وب','Website X-Ray') },
    { q: ['diagram','نمودار','flow'], action: () => openModule('diagram'), label: t('نقشه‌بردار','Data Flow') },
    { q: ['auto','اتوماسیون','workflow'], action: () => openModule('auto'), label: t('اتوماسیون','Automation') },
    { q: ['perf','عملکرد','performance'], action: () => openModule('perf'), label: t('رصد عملکرد','Performance') },
    { q: ['asset','دارایی','file'], action: () => openModule('asset'), label: t('هوش دارایی','Assets') },
    { q: ['component','کامپوننت'], action: () => openModule('component'), label: t('کامپوننت','Components') },
    { q: ['research','پژوهش','note'], action: () => openModule('research'), label: t('پژوهش','Research') },
    { q: ['backup','پشتیبان','export'], action: () => openModule('backup'), label: t('پشتیبان','Backup') },
    { q: ['export','خروجی'], action: () => { openModule('backup'); setTimeout(exportAll, 300); }, label: t('خروجی کامل داده','Export All Data') },
    { q: ['theme','تم'], action: toggleTheme, label: t('تغییر تم','Toggle Theme') },
    { q: ['lang','زبان'], action: toggleLang, label: t('تغییر زبان','Toggle Language') }
  ];
  const filter = () => {
    const v = input.value.toLowerCase().trim();
    const matched = commands.filter(c => !v || c.q.some(k => k.includes(v) || v.includes(k)) || c.label.toLowerCase().includes(v));
    results.innerHTML = matched.map((c,i) => `<div class="cmd-item ${i===0?'sel':''}" data-i="${i}">${c.label}</div>`).join('') || `<div class="cmd-item">${t('یافت نشد','No match')}</div>`;
    $$('.cmd-item', results).forEach(item => {
      item.onclick = () => { matched[item.dataset.i]?.action(); el.remove(); };
    });
  };
  input.oninput = filter;
  input.onkeydown = (e) => {
    if (e.key === 'Enter') {
      const sel = $('.cmd-item.sel', results);
      if (sel) sel.click();
    }
    if (e.key === 'Escape') el.remove();
  };
  filter();
  setTimeout(() => input.focus(), 50);
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  localStorage.setItem('nn_theme', state.theme);
}
function toggleLang() {
  state.lang = state.lang === 'fa' ? 'en' : 'fa';
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'fa' ? 'rtl' : 'ltr';
  localStorage.setItem('nn_lang', state.lang);
  $('#btn-lang').textContent = state.lang === 'fa' ? 'EN' : 'FA';
  renderNav();
  openModule(state.currentModule);
}

// -------------------- Boot --------------------
async function boot() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'fa' ? 'rtl' : 'ltr';
  $('#btn-lang').textContent = state.lang === 'fa' ? 'EN' : 'FA';
  try {
    await openDB();
  } catch (err) {
    $('#content').innerHTML = `<div class="card error">${t('IndexedDB در دسترس نیست. برخی قابلیت‌ها کار نمی‌کنند.','IndexedDB unavailable. Some features will not work.')}<br>${escapeHtml(err.message)}</div>`;
    return;
  }
  renderNav();
  openModule('dashboard');
  $('#btn-cmd').onclick = openCommandPalette;
  $('#btn-theme').onclick = toggleTheme;
  $('#btn-lang').onclick = toggleLang;
  $('#btn-menu').onclick = openCommandPalette;
  // keyboard shortcut
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openCommandPalette(); }
  });
}

boot();
